name: Optimize ARC startup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-startup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle current ARC assets and add resilient boot screen
        run: |
          python <<'PY'
          from pathlib import Path

          css_sources = [
              'styles.css','v03.css','v031.css','v032.css','v033.css','v034.css',
              'v04.css','v041.css','v042.css','v043.css','v044.css','v05.css','v051.css',
              'v052.css','v053.css','v054.css','v06.css','v061.css','v07.css','v071.css',
              'v072.css','v073.css'
          ]
          js_sources = [
              'app.js','v03.js','v031.js','v032.js','v033.js','v034.js','v04.js','v041.js',
              'v042.js','v05.js','v051.js','v052.js','v053.js','v054.js','v06.js','v061.js',
              'v07.js','v071.js','v072.js','v073.js'
          ]

          css = '\n\n'.join(Path(p).read_text() for p in css_sources)
          js = '\n;\n'.join(Path(p).read_text() for p in js_sources)
          Path('arc.bundle.css').write_text(css)
          Path('arc.bundle.js').write_text(js)

          p = Path('index.html')
          html = p.read_text()
          css_start = '  <link rel="stylesheet" href="styles.css" />'
          css_end = '  <link rel="stylesheet" href="v073.css?b=1" />'
          a = html.index(css_start)
          b = html.index(css_end, a) + len(css_end)
          critical = '''  <style>
    html,body{margin:0;min-height:100%;background:#050607;color:#f2eadf;color-scheme:dark}
    #arc-boot{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#14110d 0,#090b0c 34%,#050607 68%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:opacity .28s ease}
    #arc-boot.hide{opacity:0;pointer-events:none}
    .arc-boot-inner{text-align:center;padding:28px}.arc-boot-mark{width:62px;height:62px;margin:0 auto 18px;border:1px solid rgba(221,177,108,.28);border-radius:50%;display:grid;place-items:center;color:#ddb16c;font:30px Georgia,serif;box-shadow:0 0 45px rgba(221,177,108,.09)}
    .arc-boot-title{font:32px Georgia,serif;letter-spacing:.12em;color:#efe3d1}.arc-boot-sub{margin-top:9px;font-size:10px;letter-spacing:.18em;color:#8d8171}.arc-boot-line{width:128px;height:2px;margin:22px auto 0;background:#1d2021;overflow:hidden;border-radius:10px}.arc-boot-line i{display:block;width:42%;height:100%;background:#d6a65f;animation:arcBoot 1.15s ease-in-out infinite}.arc-boot-status{margin-top:12px;min-height:18px;font-size:9px;color:#6f7576}
    @keyframes arcBoot{0%{transform:translateX(-110%)}100%{transform:translateX(350%)}}
  </style>
  <link rel="stylesheet" href="arc.bundle.css?v=074" />'''
          html = html[:a] + critical + html[b:]

          app_div = '  <div id="app"></div>'
          boot = '''  <div id="arc-boot" role="status" aria-live="polite"><div class="arc-boot-inner"><div class="arc-boot-mark">A</div><div class="arc-boot-title">ARC</div><div class="arc-boot-sub">PROGRESS HAS A SHAPE</div><div class="arc-boot-line"><i></i></div><div id="arc-boot-status" class="arc-boot-status">Loading your Arc…</div></div></div>
  <div id="app"></div>'''
          html = html.replace(app_div, boot, 1)

          script_start = '  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          script_end = '<script src="v073.js?b=1"></script>'
          a = html.index(script_start)
          b = html.index(script_end, a) + len(script_end)
          scripts = '''  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="arc.bundle.js?v=074"></script>
  <script>
    (function(){
      const boot=()=>document.getElementById('arc-boot');
      const status=()=>document.getElementById('arc-boot-status');
      const finish=()=>{const el=boot();if(!el)return;el.classList.add('hide');setTimeout(()=>el.remove(),320)};
      window.addEventListener('load',()=>setTimeout(finish,120),{once:true});
      setTimeout(()=>{const s=status();if(s)s.textContent='Still connecting securely…';},4500);
      setTimeout(()=>{const s=status();if(s)s.textContent='This is taking longer than expected. Refresh once if it does not finish.';},10000);
    })();
  </script>'''
          html = html[:a] + scripts + html[b:]
          p.write_text(html)
          PY
      - name: Commit optimized startup bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arc.bundle.css arc.bundle.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "build: bundle ARC startup [skip ci]"
          git push

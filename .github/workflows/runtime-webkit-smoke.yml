name: ARC WebKit smoke

on:
  push:
    branches:
      - runtime-stability-review-20260910
      - qa-sprint-1
      - focus-first-ui
      - arc-insights-v1
      - main

jobs:
  webkit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve ARC
        run: |
          python3 -m http.server 4173 >/tmp/arc-http.log 2>&1 &
          echo $! > /tmp/arc-http.pid
      - name: Run ARC WebKit smoke
        run: |
          node <<'NODE'
          const {webkit}=require('playwright');
          (async()=>{
            const browser=await webkit.launch();
            const context=await browser.newContext({viewport:{width:430,height:760},userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.6 Mobile/15E148 Safari/604.1'});
            const page=await context.newPage();
            const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
            const base='http://127.0.0.1:4173/';

            await page.goto(base+'diagnostics/webkit-control.html?smoke-origin=1',{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>{
              const today=new Date();
              const prior=new Date(today.getTime()-86400000*10).toISOString().slice(0,10);
              const state={screen:'today',on:1,profile:{name:'Kimberly',goals:['Improve overall health'],primary:'Improve overall health',why:'',weight:'165',waist:'35',life:'A mix of sitting and moving',sleep:'7',location:'Home + Gym',experience:'Know the basics',days:3,duration:30,nutrition:'Guided — calories + protein',activities:['Strength training','Walking'],equipment:['Dumbbells','Bodyweight']},logs:{workouts:2,bodyChecks:1,cal:777,protein:66,steps:5821},history:{workouts:[{date:prior,name:'Saved Workout',completed:true}],nutrition:[{date:prior,food:'Saved Meal',calories:777,protein:66}],body:[{date:prior,weight:165,waist:35,hips:40,chest:38,thigh:23,arm:12}],activity:[],sleep:[],signals:[],weight:[],context:[],measurements:[]},meta:{},nutritionV1:{targets:{calories:1900}},done:false};
              localStorage.setItem('arcState',JSON.stringify(state));localStorage.setItem('arcStarted','1');
            });
            pageErrors.length=0;

            await page.goto(base+'?focus-smoke=1',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__ARC_BOOTSTRAPPING===false&&document.querySelector('.focus-today'),null,{timeout:10000});
            await page.waitForSelector('.arc-insights-hero',{state:'visible',timeout:3000});
            await page.waitForTimeout(250);

            const first=await page.evaluate(()=>({
              app:!!document.querySelector('#app>*'),screen:S.screen,boot:!!document.querySelector('#arc-boot'),suppressed:window.__arcRuntime?.suppressedRenders||0,
              focus:!!document.querySelector('.focus-primary-card'),why:!!document.querySelector('.focus-why'),glance:document.querySelectorAll('.focus-glance>button').length,
              nav:[...document.querySelectorAll('.focus-nav button')].map(x=>x.textContent.trim()),legacyBalance:getComputedStyle(document.querySelector('.arc8020-card')||document.body).display,
              target:S.nutritionV1?.targets?.calories,historyMeal:S.history?.nutrition?.[0],historyWorkout:S.history?.workouts?.[0]?.name,
              migrationBackup:!!localStorage.getItem('arcStateMigrationBackup'),lastGood:!!localStorage.getItem('arcStateLastKnownGood'),
              arcHero:!!document.querySelector('.arc-insights-hero'),arcInsight:document.querySelector('.arc-insight-card')?.textContent||'',periodButtons:document.querySelectorAll('[data-arc-period]').length,
              targetMarker:!!document.querySelector('.arc-target-marker'),nextMove:document.querySelector('[data-arc-next]')?.textContent||'',
              hierarchy:(()=>{const a=document.querySelector('.arc-insights-hero')?.getBoundingClientRect(),f=document.querySelector('.focus-primary-card')?.getBoundingClientRect();return a&&f?a.top<f.top:false})(),
              snapshot:typeof window.__arcSnapshot==='function'?window.__arcSnapshot():null
            }));
            console.log('focus-initial',first);
            if(!first.app||first.screen!=='today'||first.boot||first.suppressed<1||!first.focus||!first.why||first.glance!==3)throw new Error('Focus-first Today failed to mount');
            if(first.nav.join('|')!=='Today|Nutrition|Train|Body|More')throw new Error('Approved five-item focus navigation is not present');
            if(first.target!==1900||first.historyMeal?.name!=='Saved Meal'||first.historyMeal?.calories!==777||first.historyMeal?.protein!==66||first.historyWorkout!=='Saved Workout'||!first.migrationBackup||!first.lastGood)throw new Error('Existing user data was not preserved');
            if(!first.arcHero||!first.arcInsight.includes('ARC INSIGHT')||first.periodButtons!==2||!first.targetMarker||!first.nextMove.includes('BEST NEXT MOVE')||!first.hierarchy||!first.snapshot)throw new Error('Arc Insights is not the Today focal point');
            if(!Number.isFinite(first.snapshot.foundation)||!Number.isFinite(first.snapshot.flex)||Math.abs(first.snapshot.foundation+first.snapshot.flex-100)>.01)throw new Error('Arc 80/20 snapshot is invalid');

            const beforePeriod=await page.evaluate(()=>({target:S.nutritionV1?.targets?.calories,meal:S.history?.nutrition?.[0]?.name,workout:S.history?.workouts?.[0]?.name}));
            await page.evaluate(()=>document.querySelector('[data-arc-period="week"]')?.click());await page.waitForTimeout(100);
            const weekArc=await page.evaluate(()=>({period:document.querySelector('.arc-insights-hero')?.dataset.arcPeriodActive,active:document.querySelector('[data-arc-period].active')?.textContent.trim(),label:document.querySelector('.arc-insights-state>span')?.textContent.trim(),snapshot:window.__arcSnapshot?.('week')}));
            if(weekArc.period!=='week'||weekArc.active!=='This Week'||weekArc.label!=='THIS WEEK'||weekArc.snapshot?.period!=='week')throw new Error('Arc Today/Week toggle failed');
            await page.evaluate(()=>document.querySelector('[data-arc-evidence]')?.click());await page.waitForTimeout(50);
            const evidence=await page.evaluate(()=>({open:document.querySelector('[data-arc-evidence]')?.getAttribute('aria-expanded'),visible:getComputedStyle(document.querySelector('.arc-insight-evidence')).display,text:document.querySelector('.arc-insight-evidence')?.textContent||''}));
            if(evidence.open!=='true'||evidence.visible==='none'||!evidence.text.includes('WHAT\'S SHAPING IT'))throw new Error('Arc insight evidence layer failed');
            const afterPeriod=await page.evaluate(()=>({target:S.nutritionV1?.targets?.calories,meal:S.history?.nutrition?.[0]?.name,workout:S.history?.workouts?.[0]?.name}));
            if(JSON.stringify(beforePeriod)!==JSON.stringify(afterPeriod))throw new Error('Arc period/evidence interaction altered saved user data');

            await page.evaluate(()=>document.querySelector('[data-focus-go="arc"]')?.click());
            await page.waitForSelector('.focus-arc',{timeout:2000});
            const arc=await page.evaluate(()=>({screen:S.screen,title:document.querySelector('.focus-arc>h1')?.textContent||'',gauge:!!document.querySelector('.focus-gauge'),info:document.querySelector('[data-focus-8020]')?.textContent||''}));
            if(arc.screen!=='arc'||!arc.gauge||!arc.info.includes('What is 80/20'))throw new Error('Arc balance screen failed');
            await page.evaluate(()=>document.querySelector('[data-focus-8020]')?.click());
            await page.waitForSelector('.focus-modal',{timeout:1500});
            const modal=await page.evaluate(()=>{const r=document.querySelector('.focus-modal').getBoundingClientRect();return{text:document.querySelector('.focus-modal')?.textContent||'',center:Math.abs((r.left+r.width/2)-innerWidth/2),inside:r.top>=0&&r.bottom<=innerHeight};});
            if(!modal.text.includes('guide, not a grade')||!modal.text.includes('Build a strong foundation')||modal.center>3||!modal.inside)throw new Error('80/20 definition/centering failed');
            await page.evaluate(()=>document.querySelector('[data-focus-close]')?.click());

            await page.evaluate(()=>document.querySelector('[data-focus-go="nutrition"]')?.click());
            await page.waitForSelector('.focus-nutrition',{timeout:2000});
            const nutrition=await page.evaluate(()=>({screen:S.screen,active:document.querySelector('.focus-nav button.active')?.textContent.trim(),tabs:[...document.querySelectorAll('[data-focus-nut-tab]')].map(x=>x.textContent.trim()),meals:document.querySelectorAll('[data-focus-meal]').length,days:!!S.nutritionV1?.days,target:S.nutritionV1?.targets?.calories}));
            console.log('nutrition-focus',nutrition);
            if(nutrition.screen!=='nutrition'||nutrition.active!=='Nutrition'||nutrition.tabs.join('|')!=='Today|Plan|Recipes|Log'||nutrition.meals<3||!nutrition.days||nutrition.target!==1900)throw new Error('Focus Nutrition route failed');
            await page.evaluate(()=>document.querySelector('[data-focus-meal]')?.click());await page.waitForTimeout(100);
            const mealSaved=await page.evaluate(()=>({logged:Object.values(S.nutritionV1.days[Object.keys(S.nutritionV1.days).sort().at(-1)]?.meals||{}).some(x=>x.logged),stamp:S.meta?.localUpdatedAt||'',cal:S.logs?.cal||0}));
            if(!mealSaved.logged||!mealSaved.stamp||mealSaved.cal<=0)throw new Error('Nutrition completion did not persist');
            await page.evaluate(()=>document.querySelector('[data-focus-view-plan]')?.click());
            await page.waitForSelector('.focus-plan-view',{timeout:1500});

            await page.evaluate(()=>document.querySelector('[data-focus-go="train"]')?.click());
            await page.waitForSelector('.focus-train',{timeout:2000});
            const train=await page.evaluate(()=>({active:document.querySelector('.focus-nav button.active')?.textContent.trim(),hero:!!document.querySelector('.focus-train-hero'),rows:document.querySelectorAll('.focus-exercise-list>button').length}));
            if(train.active!=='Train'||!train.hero||train.rows<3)throw new Error('Focus Train screen failed');
            await page.evaluate(()=>document.querySelector('[data-focus-start-workout]')?.click());
            await page.waitForSelector('[data-052-done="0"]',{timeout:3000});
            const workout=await page.evaluate(()=>({checks:[...document.querySelectorAll('[data-052-done]')].map(x=>x.textContent.trim()),maxScroll:document.documentElement.scrollHeight-innerHeight,name:document.querySelector('.exercise-copy h1')?.textContent||''}));
            if(workout.checks.some(x=>x!=='○')||workout.maxScroll<80||!workout.name)throw new Error('Fresh workout state invalid');
            await page.evaluate(()=>window.scrollTo(0,Math.min(320,document.documentElement.scrollHeight-innerHeight)));
            const y0=await page.evaluate(()=>scrollY);if(y0<50)throw new Error('Could not establish workout scroll position');
            await page.evaluate(()=>document.querySelector('[data-052-done="0"]')?.click());await page.waitForTimeout(80);
            const afterOne=await page.evaluate(()=>({y:scrollY,checks:[...document.querySelectorAll('[data-052-done]')].map(x=>x.textContent.trim()),stamp:S.meta?.localUpdatedAt||''}));
            if(Math.abs(afterOne.y-y0)>2||afterOne.checks.join('')!=='✓○○'||!afterOne.stamp)throw new Error('Workout scroll/state persistence regressed');
            await page.evaluate(()=>{document.querySelector('[data-052-done="1"]')?.click();document.querySelector('[data-052-done="2"]')?.click()});await page.waitForTimeout(80);
            const priorName=await page.evaluate(()=>document.querySelector('.exercise-copy h1')?.textContent||'');
            await page.evaluate(()=>document.querySelector('[data-052-next]')?.click());await page.waitForTimeout(100);
            const nextEx=await page.evaluate(()=>({name:document.querySelector('.exercise-copy h1')?.textContent||'',checks:[...document.querySelectorAll('[data-052-done]')].map(x=>x.textContent.trim())}));
            if(nextEx.name===priorName||nextEx.checks.some(x=>x!=='○'))throw new Error('Next exercise inherited checked state');

            await page.evaluate(()=>{S.screen='body';save();render()});
            await page.waitForSelector('.focus-body-map',{timeout:2000});
            const body=await page.evaluate(()=>({screen:S.screen,labels:[...document.querySelectorAll('.focus-body-lines b')].map(x=>x.textContent),update:!!document.querySelector('[data-body-checkin-052]')}));
            if(body.screen!=='body'||body.labels.join('|')!=='Neck|Shoulders|Chest|Arms|Waist|Hips|Thighs|Calves'||!body.update)throw new Error('Full-body mockup screen failed');

            await page.evaluate(()=>document.querySelector('[data-focus-go="community"]')?.click());
            await page.waitForSelector('.focus-more',{timeout:1500});
            const more=await page.evaluate(()=>({active:document.querySelector('.focus-nav button.active')?.textContent.trim(),items:document.querySelectorAll('.focus-more-list>button').length,promo:!!document.querySelector('.focus-more-promo')}));
            if(more.active!=='More'||more.items<5||!more.promo)throw new Error('More/Explore screen failed');

            await page.evaluate(()=>{S.screen='today';save();render()});
            await page.goto(base+'diagnostics/webkit-control.html?webkit-away=1',{waitUntil:'domcontentloaded'});await page.goBack({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__ARC_BOOTSTRAPPING===false&&document.querySelector('.focus-today'),null,{timeout:10000});
            await page.waitForSelector('.arc-insights-hero',{state:'visible',timeout:3000});
            const back=await page.evaluate(()=>({app:!!document.querySelector('.focus-today'),arc:!!document.querySelector('.arc-insights-hero'),stamp:S.meta?.localUpdatedAt||'',historyMeal:S.history?.nutrition?.[0],historyWorkout:S.history?.workouts?.[0]?.name,target:S.nutritionV1?.targets?.calories,lastGood:!!localStorage.getItem('arcStateLastKnownGood')}));
            if(!back.app||!back.arc||!back.stamp||back.historyMeal?.name!=='Saved Meal'||back.historyMeal?.calories!==777||back.historyMeal?.protein!==66||back.historyWorkout!=='Saved Workout'||back.target!==1900||!back.lastGood)throw new Error('Lifecycle restore lost UI, Arc Insights, or saved data');

            if(pageErrors.length)throw new Error('ARC page errors: '+pageErrors.join(' | '));
            await browser.close();console.log('ARC Focus UI WebKit smoke: PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

name: ARC premium visual QA

on:
  push:
    branches:
      - premium-ux-pass

jobs:
  premium-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve ARC
        run: |
          python3 -m http.server 4173 >/tmp/arc-premium-http.log 2>&1 &
          echo $! > /tmp/arc-premium-http.pid
      - name: Run premium UX review
        run: |
          mkdir -p visual-review
          node <<'NODE'
          const {webkit}=require('playwright');
          const base='http://127.0.0.1:4173/';
          const seed=async(page)=>{
            await page.goto(base+'diagnostics/webkit-control.html?premium-seed=1',{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>{
              const d=new Date();const key=d.toISOString().slice(0,10);const prior=new Date(d.getTime()-86400000*12).toISOString().slice(0,10);
              const state={screen:'today',on:1,profile:{name:'Kimberly',goals:['Improve overall health'],primary:'Improve overall health',why:'Feel strong and confident',weight:'165',waist:'35',life:'A mix of sitting and moving',sleep:'7',location:'Home + Gym',experience:'Know the basics',days:3,duration:30,nutrition:'Guided — calories + protein',activities:['Strength training','Walking'],equipment:['Dumbbells','Bodyweight']},logs:{workouts:2,bodyChecks:1,cal:1280,protein:92,steps:5821},history:{workouts:[{date:prior,name:'Full Body Strength',completed:true}],nutrition:[{date:prior,name:'Greek yogurt, berries, walnuts',calories:380,protein:28}],body:[{date:prior,weight:165,neck:13.5,shoulders:42,chest:38,arm:12.5,waist:35,hips:40,thigh:23,calf:14.5}],activity:[],sleep:[],signals:[],weight:[],context:[],measurements:[]},meta:{},nutritionV1:{targets:{calories:1900,protein:140},days:{[key]:{meals:{breakfast:{logged:true,portion:1}},custom:[{id:'visual-flex',name:'Dark chocolate',calories:120,protein:2,balance:'flex'}]}}},done:false};
              localStorage.setItem('arcState',JSON.stringify(state));localStorage.setItem('arcStarted','1');
            });
          };
          const openProduct=async(page)=>{
            await page.goto(base+'?premium-visual=1',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__ARC_BOOTSTRAPPING===false&&window.__ARC_PREMIUM_UI===true&&window.__ARC_PREMIUM_V2===true&&document.documentElement.classList.contains('arc-premium-v2')&&document.querySelector('.focus-today'),null,{timeout:12000});
            await page.addStyleTag({content:'.arc-auth-shield,.arc-auth-gate,.arc-cloud-account{display:none!important}'});
            await page.waitForTimeout(700);
          };
          const visible=async(page,selector)=>page.locator(selector).evaluateAll(nodes=>nodes.filter(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity!==0&&r.width>0&&r.height>0}).length);
          const assertBaseChrome=async(page)=>{
            const state=await page.evaluate(()=>({
              screen:S.screen,
              nav:[...document.querySelectorAll('.focus-nav button')].map(x=>x.textContent.trim()),
              hero:getComputedStyle(document.querySelector('.focus-hero-art')).backgroundImage,
              premium:getComputedStyle(document.documentElement).getPropertyValue('--arc-forest').trim(),
              shell:(()=>{const r=document.querySelector('.phone')?.getBoundingClientRect();return r?{width:r.width,left:r.left,right:r.right}:null})(),
              bodyBg:getComputedStyle(document.body).backgroundColor,
              appBg:getComputedStyle(document.querySelector('#app')).backgroundColor,
              savedMeal:S.history?.nutrition?.[0]?.name,
              savedWorkout:S.history?.workouts?.[0]?.name,
              target:S.nutritionV1?.targets?.calories
            }));
            if(state.screen!=='today'||state.nav.join('|')!=='Today|Nutrition|Train|Body|More')throw new Error('Premium Today structure failed');
            if(!state.hero.includes('images.unsplash.com')||!state.premium)throw new Error('Editorial premium visual layer failed to load');
            if(state.savedMeal!=='Greek yogurt, berries, walnuts'||state.savedWorkout!=='Full Body Strength'||state.target!==1900)throw new Error('Premium layer altered saved data');
            if(await visible(page,'.focus-nav')!==1)throw new Error('Focus navigation is not the single visible product nav');
            if(await visible(page,'.arc-mobile-brandline')!==0||await visible(page,'.arc-rail')!==0||await visible(page,'.nav')!==0)throw new Error('Legacy ARC chrome is still visible');
            const minWidth=page.viewportSize().width<=500?400:540;
            if(!state.shell||state.shell.width<minWidth)throw new Error(`Focus canvas is unexpectedly narrow: ${state.shell?.width}`);
            if(state.bodyBg==='rgb(5, 6, 7)'||state.appBg==='rgb(5, 6, 7)')throw new Error('Legacy black shell is still visible');
          };
          const review=async(page,prefix)=>{
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await seed(page);await openProduct(page);await assertBaseChrome(page);
            const today=await page.evaluate(()=>({heroH:document.querySelector('.focus-primary-card')?.getBoundingClientRect().height||0,why:document.querySelector('.focus-why')?.textContent||''}));
            if(today.heroH<220||!today.why.includes('WHY ARC CHOSE THIS'))throw new Error('Today no longer matches Focus-first hierarchy');
            await page.screenshot({path:`visual-review/${prefix}-today.png`,fullPage:true});

            await page.evaluate(()=>document.querySelector('[data-focus-go="nutrition"]')?.click());
            await page.waitForSelector('.focus-nutrition',{state:'visible',timeout:3500});await page.waitForTimeout(350);
            const nutrition=await page.evaluate(()=>{const n=document.querySelector('.focus-nutrition'),h=document.querySelector('.focus-nut-hero'),t=document.querySelector('.focus-tabs');const ns=n&&getComputedStyle(n),hs=h&&getComputedStyle(h);return{display:ns?.display,visibility:ns?.visibility,opacity:ns?.opacity,height:n?.getBoundingClientRect().height||0,heroH:h?.getBoundingClientRect().height||0,hero:hs?.backgroundImage||'',text:n?.textContent||'',tabs:t&&getComputedStyle(t).display}});
            if(nutrition.display==='none'||nutrition.visibility==='hidden'||+nutrition.opacity===0||nutrition.height<420||nutrition.heroH<180||!nutrition.text.includes('Eat for Your Goals')||nutrition.tabs!=='grid')throw new Error('Nutrition is present in DOM but not visibly rendered');
            if(!nutrition.hero.includes('images.unsplash.com'))throw new Error('Nutrition editorial image is missing');
            await page.screenshot({path:`visual-review/${prefix}-nutrition.png`,fullPage:true});

            await page.evaluate(()=>document.querySelector('[data-focus-go="train"]')?.click());
            await page.waitForSelector('.focus-train',{state:'visible',timeout:3000});await page.waitForTimeout(350);
            const train=await page.evaluate(()=>({rows:document.querySelectorAll('.focus-exercise-list>button').length,svgs:document.querySelectorAll('.focus-ex-thumb svg').length,photoThumbs:[...document.querySelectorAll('.focus-ex-thumb')].filter(x=>getComputedStyle(x).backgroundImage.includes('url(')).length,hero:getComputedStyle(document.querySelector('.focus-train-hero .focus-hero-art')).backgroundImage}));
            if(train.rows<3||train.svgs!==train.rows||train.photoThumbs!==0||!train.hero.includes('images.unsplash.com'))throw new Error('Train visual hierarchy / movement diagrams failed');
            await page.screenshot({path:`visual-review/${prefix}-train.png`,fullPage:true});

            await page.evaluate(()=>{S.screen='body';save();render()});
            await page.waitForSelector('.focus-body-map svg[data-premium="1"]',{state:'visible',timeout:3500});await page.waitForTimeout(350);
            const body=await page.evaluate(()=>({labels:[...document.querySelectorAll('.focus-body-lines b')].map(x=>x.textContent),premium:document.querySelector('.focus-body-map svg')?.dataset.premium,values:document.querySelectorAll('.arc-map-value').length,h:document.querySelector('.focus-body-visual')?.getBoundingClientRect().height||0}));
            if(body.labels.length!==8||body.premium!=='1'||body.values<5||body.h<450)throw new Error('Premium Body measurement instrument failed');
            await page.screenshot({path:`visual-review/${prefix}-body.png`,fullPage:true});

            await page.evaluate(()=>{S.screen='arc';save();render()});
            await page.waitForSelector('.focus-gauge svg[data-premium="1"]',{state:'visible',timeout:3500});await page.waitForSelector('.focus-arc-story',{state:'visible',timeout:3000});await page.waitForTimeout(350);
            const arc=await page.evaluate(()=>({back:!!document.querySelector('.focus-arc-back'),story:!!document.querySelector('.focus-arc-story'),activeNav:document.querySelectorAll('.focus-nav button.active').length,quote:document.querySelector('.focus-arc blockquote')?.textContent||''}));
            if(!arc.back||!arc.story||arc.activeNav!==0||!arc.quote.includes('Consistency creates progress'))throw new Error('Arc detail visual/story treatment failed');
            await page.screenshot({path:`visual-review/${prefix}-arc.png`,fullPage:true});

            await page.evaluate(()=>document.querySelector('[data-focus-go="community"]')?.click());
            await page.waitForSelector('.focus-more',{state:'visible',timeout:3000});await page.waitForTimeout(350);
            if(await visible(page,'.arc-mobile-brandline')!==0||await visible(page,'.arc-rail')!==0)throw new Error('Legacy chrome returned on More');
            await page.screenshot({path:`visual-review/${prefix}-more.png`,fullPage:true});

            const preserved=await page.evaluate(()=>({meal:S.history?.nutrition?.[0]?.name,workout:S.history?.workouts?.[0]?.name,target:S.nutritionV1?.targets?.calories,body:S.history?.body?.[0]?.waist}));
            if(preserved.meal!=='Greek yogurt, berries, walnuts'||preserved.workout!=='Full Body Strength'||preserved.target!==1900||preserved.body!==35)throw new Error('Visual pass changed seeded user data');
            if(errors.length)throw new Error('Page errors: '+errors.join(' | '));
          };
          (async()=>{
            const browser=await webkit.launch();
            const phone=await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:2,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.6 Mobile/15E148 Safari/604.1'});
            await review(await phone.newPage(),'phone');await phone.close();

            const ipad=await browser.newContext({viewport:{width:834,height:1194},deviceScaleFactor:2,userAgent:'Mozilla/5.0 (iPad; CPU OS 26_6_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.6 Mobile/15E148 Safari/604.1'});
            await review(await ipad.newPage(),'ipad');await ipad.close();
            await browser.close();
            console.log('ARC premium visual QA: PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-premium-visual-review
          path: visual-review
          if-no-files-found: warn
          retention-days: 7

  <title>Arc — Progress Has a Shape</title>

  <style>
    html,body{margin:0;min-height:100%;background:#050607;color:#f2eadf;color-scheme:dark}
    #arc-boot{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#15110d 0,#0a0c0d 34%,#050607 70%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:opacity .28s ease}
    #arc-boot.hide{opacity:0;pointer-events:none}.arc-boot-inner{text-align:center;padding:28px}.arc-boot-mark{width:64px;height:64px;margin:0 auto 18px;border:1px solid rgba(221,177,108,.28);border-radius:50%;display:grid;place-items:center;color:#ddb16c;font:31px Georgia,serif;box-shadow:0 0 45px rgba(221,177,108,.10)}
    .arc-boot-title{font:32px Georgia,serif;letter-spacing:.12em;color:#efe3d1}.arc-boot-sub{margin-top:9px;font-size:9px;letter-spacing:.18em;color:#8d8171}.arc-boot-line{width:128px;height:2px;margin:22px auto 0;background:#1d2021;overflow:hidden;border-radius:10px}.arc-boot-line i{display:block;width:42%;height:100%;background:#d6a65f;animation:arcBoot 1.15s ease-in-out infinite}.arc-boot-status{margin-top:12px;min-height:18px;font-size:9px;color:#747b7c;max-width:280px}@keyframes arcBoot{0%{transform:translateX(-110%)}100%{transform:translateX(350%)}}
  </style>

  <link rel="stylesheet" href="v04.css?v=074" /><link rel="stylesheet" href="v041.css?v=074" /><link rel="stylesheet" href="v042.css?v=074" /><link rel="stylesheet" href="v043.css?v=074" /><link rel="stylesheet" href="v044.css?v=074" />
  <link rel="stylesheet" href="v05.css?v=074" /><link rel="stylesheet" href="v051.css?v=074" /><link rel="stylesheet" href="v052.css?v=074" /><link rel="stylesheet" href="v053.css?v=074" /><link rel="stylesheet" href="v054.css?v=074" />
  <link rel="stylesheet" href="v06.css?v=074" /><link rel="stylesheet" href="v061.css?v=074" /><link rel="stylesheet" href="v07.css?v=074" /><link rel="stylesheet" href="v071.css?v=074" /><link rel="stylesheet" href="v072.css?v=074" /><link rel="stylesheet" href="v073.css?v=074" />
</head>
<body>
  <div id="arc-boot"><div class="arc-boot-inner"><div class="arc-boot-mark">A</div><div class="arc-boot-title">ARC</div><div class="arc-boot-sub">PROGRESS HAS A SHAPE</div><div class="arc-boot-line"><i></i></div><div id="arc-boot-status" class="arc-boot-status">Loading your Arc…</div></div></div>
  <div id="app"></div>
  <script>
    if(localStorage.arcVersion!=='0.3.3'){localStorage.removeItem('arcStarted');localStorage.removeItem('arcState');localStorage.arcVersion='0.3.3';}
    try{const state=JSON.parse(localStorage.getItem('arcState')||'null');if(state&&state.profile&&!state.profile.name){state.profile.name='Kimberly';localStorage.setItem('arcState',JSON.stringify(state));}}catch(e){}
    setTimeout(()=>{const s=document.getElementById('arc-boot-status');if(s)s.textContent='Still connecting securely…';},4500);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>window.addEventListener('load',()=>setTimeout(()=>{const b=document.getElementById('arc-boot');if(b){b.classList.add('hide');setTimeout(()=>b.remove(),320);}},100));</script>
</body>
</html>

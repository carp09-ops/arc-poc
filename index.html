<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1014" />
  <title>Arc — Progress has a shape</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="v03.css" />
  <link rel="stylesheet" href="v031.css" />
  <link rel="stylesheet" href="v032.css" />
  <link rel="stylesheet" href="v033.css" />
  <link rel="stylesheet" href="v034.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    // Preserve the 0.3.3 first-run reset while allowing the 0.3.4 integrity layer to migrate existing local state safely.
    if(localStorage.arcVersion!=='0.3.3'){
      localStorage.removeItem('arcStarted');
      localStorage.removeItem('arcState');
      localStorage.arcVersion='0.3.3';
    }
    try {
      const state = JSON.parse(localStorage.getItem('arcState') || 'null');
      if (state && state.profile && !state.profile.name) {
        state.profile.name = 'Kimberly';
        localStorage.setItem('arcState', JSON.stringify(state));
      }
    } catch (e) {}
  </script>
  <script src="app.js"></script>
  <script src="v03.js"></script>
  <script src="v031.js"></script>
  <script src="v032.js"></script>
  <script src="v033.js"></script>
  <script src="v034.js"></script>
</body>
</html>

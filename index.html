  <div id="arc-boot" role="status" aria-live="polite"><div class="arc-boot-inner"><div class="arc-boot-mark">A</div><div class="arc-boot-title">ARC</div><div class="arc-boot-sub">PROGRESS HAS A SHAPE</div><div class="arc-boot-line"><i></i></div><div id="arc-boot-status" class="arc-boot-status">Starting ARC core…</div></div></div>
  <div id="app"></div>
  <script>
    (function(){
      const status=()=>document.getElementById('arc-boot-status');
      const setStatus=(msg)=>{const s=status();if(s)s.textContent=msg;};
      const finish=()=>{const el=document.getElementById('arc-boot');if(!el||el.classList.contains('hide'))return;el.classList.add('hide');setTimeout(()=>el.remove(),320);};
      const check=()=>{if(document.querySelector('#app>*')){finish();return true}return false};
      window.__arcScriptFail=function(name){setStatus('Could not load '+name+'. Refresh once.');};
      window.addEventListener('error',function(e){
        if(check())return;
        const src=e.filename?e.filename.split('/').pop().split('?')[0]:'';
        const msg=(e.message||'startup error').replace(/^Uncaught\s*/,'').slice(0,110);
        setStatus('Startup error'+(src?' in '+src:'')+': '+msg);
      });
      window.addEventListener('unhandledrejection',function(e){
        if(check())return;
        const msg=String(e.reason?.message||e.reason||'startup promise failed').slice(0,120);
        setStatus('Startup promise error: '+msg);
      });
      const poll=setInterval(()=>{if(check())clearInterval(poll)},60);
      setTimeout(()=>{if(!check())setStatus('ARC core is still starting…');},3000);
      setTimeout(()=>{if(!check()){clearInterval(poll);setStatus('ARC core did not finish starting. A startup dependency is blocked.');}},9000);
      window.__arcBootCheck=check;
      window.__arcScriptsDone=check;

      try{
        if(window.localStorage){
          if(localStorage.getItem('arcVersion')!=='0.3.3'){
            localStorage.removeItem('arcStarted');
            localStorage.removeItem('arcState');
            localStorage.setItem('arcVersion','0.3.3');
          }
          try{
            const state=JSON.parse(localStorage.getItem('arcState')||'null');
            if(state&&state.profile&&!state.profile.name){state.profile.name='Kimberly';localStorage.setItem('arcState',JSON.stringify(state));}
          }catch(e){}
        }
      }catch(e){
        window.__arcStorageUnavailable=true;
        setStatus('Browser storage is unavailable. Starting ARC without local cache…');
      }
    })();
  </script>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f1e8" />
  <title>Arc — Progress has a shape</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    if(localStorage.arcVersion!=='0.2'){
      localStorage.removeItem('arcStarted');
      localStorage.removeItem('arcState');
      localStorage.arcVersion='0.2';
    }
    // POC 0.2 test persona migration: Kimberly
    try {
      const state = JSON.parse(localStorage.getItem('arcState') || 'null');
      if (state && state.profile) {
        state.profile.name = 'Kimberly';
        localStorage.setItem('arcState', JSON.stringify(state));
      }
    } catch (e) {}
  </script>
  <script src="app.js"></script>
</body>
</html>

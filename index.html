    #arc-boot.hide{opacity:0;pointer-events:none}
    .arc-boot-inner{text-align:center;padding:28px}.arc-boot-mark{width:64px;height:64px;margin:0 auto 18px;border:1px solid rgba(221,177,108,.28);border-radius:50%;display:grid;place-items:center;color:#ddb16c;font:31px Georgia,serif;box-shadow:0 0 45px rgba(221,177,108,.10)}
    .arc-boot-title{font:32px Georgia,serif;letter-spacing:.12em;color:#efe3d1}.arc-boot-sub{margin-top:9px;font-size:9px;letter-spacing:.18em;color:#8d8171}.arc-boot-line{width:128px;height:2px;margin:22px auto 0;background:#1d2021;overflow:hidden;border-radius:10px}.arc-boot-line i{display:block;width:42%;height:100%;background:#d6a65f;animation:arcBoot 1.15s ease-in-out infinite}.arc-boot-status{margin-top:12px;min-height:18px;font-size:9px;color:#747b7c;max-width:280px}
    @keyframes arcBoot{0%{transform:translateX(-110%)}100%{transform:translateX(350%)}}

  <div id="app"></div>
  <script>
    if(localStorage.arcVersion!=='0.3.3'){
      localStorage.removeItem('arcStarted');
      localStorage.removeItem('arcState');
      localStorage.arcVersion='0.3.3';
    }
    try { const state=JSON.parse(localStorage.getItem('arcState')||'null'); if(state&&state.profile&&!state.profile.name){state.profile.name='Kimberly';localStorage.setItem('arcState',JSON.stringify(state));} } catch(e){}
    (function(){
      const TOTAL_STYLES=23;
      let scriptsDone=false;
      const status=()=>document.getElementById('arc-boot-status');
      const finish=()=>{const el=document.getElementById('arc-boot');if(!el||el.classList.contains('hide'))return;el.classList.add('hide');setTimeout(()=>el.remove(),320);};
      window.__arcBootCheck=function(){
        const appReady=!!document.querySelector('#app>*');
        if(scriptsDone&&appReady&&window.__arcStylesReady>=TOTAL_STYLES)finish();
      };
      window.__arcScriptsDone=function(){scriptsDone=true;window.__arcBootCheck();};
      setTimeout(()=>{const s=status();if(s)s.textContent='Still connecting securely…';},4500);
      setTimeout(()=>{const s=status();if(s)s.textContent='This is taking longer than expected. If it stays here, refresh once.';},10000);
      window.addEventListener('load',()=>setTimeout(()=>{scriptsDone=true;window.__arcBootCheck();},80),{once:true});
    })();
  </script>

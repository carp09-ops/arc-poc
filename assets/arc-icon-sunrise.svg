<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Arc</title><desc id="desc">Arc sunrise over alpine mountains and a radiant horizon.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071522"/><stop offset=".46" stop-color="#12314a"/><stop offset=".68" stop-color="#c8752c"/><stop offset=".78" stop-color="#f6b04b"/><stop offset="1" stop-color="#0a2032"/></linearGradient>
  <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15364b"/><stop offset="1" stop-color="#06131f"/></linearGradient>
  <radialGradient id="sun"><stop offset="0" stop-color="#fff9dc"/><stop offset=".25" stop-color="#ffd089"/><stop offset=".62" stop-color="#f6a623" stop-opacity=".55"/><stop offset="1" stop-color="#f6a623" stop-opacity="0"/></radialGradient>
  <linearGradient id="horizon" x1="0" x2="1"><stop stop-color="#f6a623" stop-opacity="0"/><stop offset=".18" stop-color="#f6a623"/><stop offset=".5" stop-color="#fff4cf"/><stop offset=".82" stop-color="#f6a623"/><stop offset="1" stop-color="#f6a623" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="34"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#sky)"/>
<circle cx="512" cy="446" r="190" fill="url(#sun)" filter="url(#soft)"/>
<!-- distant alpine silhouettes -->
<path d="M0 558L102 473l63 39 93-142 62 91 54-50 91 104 58-57 72 60 73-109 55 71 77-108 76 98 70-51 80 91v145H0Z" fill="#132c3d"/>
<path d="M0 602l123-96 58 35 86-126 56 80 47-37 85 92 66-58 61 45 86-110 58 73 76-96 62 83 80-53 80 82v118H0Z" fill="#0a1d2c"/>
<!-- snow facets -->
<path d="M267 415l-31 75 32-28 22 18 33 15-56-80Zm401 12-39 80 39-37 23 19 35 11-58-73Zm-545 79-31 47 31-18 22 10 18 2-40-41Zm679-102-35 70 36-31 25 20 24 6-50-65Z" fill="#9fb5c4" opacity=".55"/>
<path d="M267 415l20 47 36 33-56-80Zm401 12 20 43 38 30-58-73Zm134-23 20 39 30 26-50-65Z" fill="#d9e2e8" opacity=".32"/>
<!-- lake -->
<rect y="604" width="1024" height="420" fill="url(#lake)"/>
<path d="M0 604h1024v34c-126 17-236 12-337-1-112-15-229-16-344 0-122 17-237 16-343 2Z" fill="#21485b" opacity=".65"/>
<!-- mountain reflection -->
<path d="M0 605l123 72 58-26 86 96 56-61 47 28 85-70 66 43 61-34 86 84 58-55 76 72 62-62 80 40 80-63v205H0Z" fill="#081923" opacity=".72"/>
<!-- sunrise + radiant horizon -->
<circle cx="512" cy="600" r="54" fill="url(#sun)" filter="url(#glow)"/>
<rect x="90" y="596" width="844" height="8" rx="4" fill="url(#horizon)" filter="url(#glow)"/>
<circle cx="512" cy="600" r="15" fill="#fff8d9" filter="url(#glow)"/>
<path d="M512 616c-40 53-67 111-78 174h156c-11-63-38-121-78-174Z" fill="#f6a623" opacity=".12"/>
<!-- wordmark -->
<text x="512" y="892" text-anchor="middle" fill="#fff8ed" font-family="Georgia, 'Times New Roman', serif" font-size="126" font-weight="500" letter-spacing="-4">Arc</text>
<text x="512" y="950" text-anchor="middle" fill="#d8e1ea" font-family="Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="9">PROGRESS HAS A SHAPE</text>
</svg>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARC Resume Bisect</title>
<style>
:root{color-scheme:dark}html,body{margin:0;min-height:100%;background:#050607;color:#eee5d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}#diag{position:relative;z-index:2147483647;margin:12px;padding:14px;border:1px solid #80663d;border-radius:14px;background:#080a0b;color:#eee5d9;box-shadow:0 12px 50px #000b}#title{font-weight:800;letter-spacing:.08em;font-size:13px;color:#deb36f}#state{font-size:13px;font-weight:800;margin:7px 0;color:#c4cbc9}#log{white-space:pre-wrap;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#aab2b0}.pass{color:#9adeb2!important}.fail{color:#ffaaa0!important}.warn{color:#f1cc84!important}#app{margin:12px;min-height:180px;background:#fff;color:#111;padding:12px;border-radius:12px;overflow:auto}
</style>
</head>
<body>
<div id="diag"><div id="title">ARC RESUME BISECT · AUTH OFF · CSS OFF</div><div id="state">Starting…</div><pre id="log">HTML: PASS</pre></div>
<div id="app"></div>
<script>
(function(){
  var files=['app.js','v03.js','v031.js','v032.js','v033.js','v034.js','v04.js','v041.js','v042.js','v05.js','v051.js','v052.js','v053.js','v054.js','v06.js','v07.js','v071.js','v072.js','v075.js'];
  var params=new URLSearchParams(location.search);var count=parseInt(params.get('count')||'9',10);if(!Number.isFinite(count)||count<1)count=9;if(count>files.length)count=files.length;
  var state=document.getElementById('state'),log=document.getElementById('log'),current='bootstrap',stopped=false;
  function say(s,k){log.textContent+='\n'+s;if(k)log.className=k}
  function setState(s,k){state.textContent=s;state.className=k||''}
  function stamp(evt){try{var key='arcResumeBisectLog';var arr=JSON.parse(localStorage.getItem(key)||'[]');arr.push({t:new Date().toISOString(),evt:evt,count:count,visibility:document.visibilityState,hasApp:!!document.querySelector('#app>*'),children:document.body?document.body.children.length:null});if(arr.length>40)arr=arr.slice(-40);localStorage.setItem(key,JSON.stringify(arr));}catch(e){}}
  function fail(msg){if(stopped)return;stopped=true;setState('STOPPED at '+current,'fail');say('FAIL: '+msg,'fail');stamp('fail:'+msg)}
  window.addEventListener('error',function(e){if(!stopped)fail((e.filename||current)+': '+(e.message||'runtime error'))});
  window.addEventListener('unhandledrejection',function(e){if(!stopped)fail(current+': '+String((e.reason&&e.reason.message)||e.reason||'promise rejection'))});
  document.addEventListener('visibilitychange',function(){stamp('visibility:'+document.visibilityState);if(document.visibilityState==='visible'){setTimeout(function(){if(!document.querySelector('#diag'))return;var ok=!!document.querySelector('#app>*');setState(ok?'RESUMED — DOM still present':'RESUMED — #app is empty',ok?'pass':'fail');say('Resume check: '+(ok?'app DOM present':'app DOM empty'),ok?'pass':'fail');stamp('resume-check:'+ok)},250)}});
  window.addEventListener('pageshow',function(e){stamp('pageshow persisted='+e.persisted)});
  window.addEventListener('pagehide',function(e){stamp('pagehide persisted='+e.persisted)});
  function load(file){return new Promise(function(resolve,reject){current=file;setState('Loading '+file+' ('+(files.indexOf(file)+1)+'/'+count+')');var s=document.createElement('script');var done=false;var timer=setTimeout(function(){if(done)return;done=true;reject(new Error(file+' timeout'));},8000);s.src='../'+file+'?resume-bisect=1';s.async=false;s.onload=function(){if(done)return;done=true;clearTimeout(timer);say(file+': loaded','pass');resolve()};s.onerror=function(){if(done)return;done=true;clearTimeout(timer);reject(new Error(file+' network error'))};document.body.appendChild(s)})}
  (async function(){try{stamp('boot');for(var i=0;i<count;i++){await load(files[i]);await new Promise(function(r){setTimeout(r,35)})}current='ready';var end=files[count-1];setState('READY — loaded through '+end+'. Background Safari now, then return.','pass');say('Loaded '+count+' scripts through '+end,'pass');say('AUTH: OFF','pass');say('ARC CSS: OFF','pass');stamp('ready-through:'+end)}catch(e){fail(e&&e.message?e.message:String(e))}})();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARC Full Core v06 Fix Probe</title>
<style>
:root{color-scheme:dark}html,body{margin:0;min-height:100%;background:#050607;color:#eee5d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}#diag{position:relative;z-index:2147483647;margin:12px;padding:14px;border:1px solid #80663d;border-radius:14px;background:#080a0b;color:#eee5d9;box-shadow:0 12px 50px #000b}#title{font-weight:800;letter-spacing:.08em;font-size:13px;color:#deb36f}#state{font-size:13px;font-weight:800;margin:7px 0;color:#c4cbc9}#log{white-space:pre-wrap;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#aab2b0}.pass{color:#9adeb2!important}.fail{color:#ffaaa0!important}.warn{color:#f1cc84!important}#app{margin:12px;min-height:180px;background:#fff;color:#111;padding:12px;border-radius:12px;overflow:auto}
</style>
</head>
<body>
<div id="diag"><div id="title">ARC FULL CORE · v06 AUTO-RENDER SUPPRESSED · AUTH OFF · CSS OFF</div><div id="state">Starting…</div><pre id="log">HTML: PASS</pre></div>
<div id="app"></div>
<script>
(function(){
  var before=['app.js','v03.js','v031.js','v032.js','v033.js','v034.js','v04.js','v041.js','v042.js','v05.js','v051.js','v052.js','v053.js','v054.js'];
  var after=['v07.js','v071.js','v072.js','v075.js'];
  var state=document.getElementById('state'),log=document.getElementById('log'),current='bootstrap',stopped=false;
  function say(s,k){log.textContent+='\n'+s;if(k)log.className=k}
  function setState(s,k){state.textContent=s;state.className=k||''}
  function fail(msg){if(stopped)return;stopped=true;setState('STOPPED at '+current,'fail');say('FAIL: '+msg,'fail')}
  window.addEventListener('error',function(e){if(!stopped)fail((e.filename||current)+': '+(e.message||'runtime error'))});
  window.addEventListener('unhandledrejection',function(e){if(!stopped)fail(current+': '+String((e.reason&&e.reason.message)||e.reason||'promise rejection'))});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){setTimeout(function(){var ok=!!document.querySelector('#app>*');setState(ok?'RESUMED — DOM still present':'RESUMED — #app is empty',ok?'pass':'fail');say('Resume check: '+(ok?'app DOM present':'app DOM empty'),ok?'pass':'fail')},250)}});
  function load(file){return new Promise(function(resolve,reject){current=file;setState('Loading '+file+'…');var s=document.createElement('script');var done=false;var timer=setTimeout(function(){if(done)return;done=true;reject(new Error(file+' timeout'));},8000);s.src='../'+file+'?full-core-v06fix=1';s.async=false;s.onload=function(){if(done)return;done=true;clearTimeout(timer);say(file+': loaded','pass');resolve()};s.onerror=function(){if(done)return;done=true;clearTimeout(timer);reject(new Error(file+' network error'))};document.body.appendChild(s)})}
  async function loadPatchedV06(){current='v06.js (patched probe)';setState('Loading v06.js with only automatic render suppressed…');var r=await fetch('../v06.js?full-core-v06fix=1',{cache:'no-store'});if(!r.ok)throw new Error('v06.js fetch HTTP '+r.status);var code=await r.text();var needle="if(['today','arc','train'].includes(S.screen))render();";if(!code.includes(needle))throw new Error('v06 automatic render line not found');code=code.replace(needle,"/* diagnostic: automatic load-time render intentionally suppressed */");var s=document.createElement('script');s.textContent=code;document.body.appendChild(s);say('v06.js: loaded with only automatic render suppressed','pass')}
  (async function(){try{
    for(var i=0;i<before.length;i++){await load(before[i]);await new Promise(function(r){setTimeout(r,35)})}
    await loadPatchedV06();await new Promise(function(r){setTimeout(r,50)});
    for(var j=0;j<after.length;j++){await load(after[j]);await new Promise(function(r){setTimeout(r,50)})}
    if(!document.querySelector('#app>*'))throw new Error('full stack loaded but #app is empty');
    current='ready';setState('READY — full ARC core through v075.js loaded. Background Safari now, then return.','pass');
    say('FULL CORE: PASS through v075.js','pass');say('v06 change: only automatic load-time render suppressed','pass');say('AUTH: OFF','pass');say('ARC CSS: OFF','pass');
  }catch(e){fail(e&&e.message?e.message:String(e))}})();
})();
</script>
</body>
</html>

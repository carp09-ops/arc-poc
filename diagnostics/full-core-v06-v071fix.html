<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARC Full Core v06 + v071 Control</title>
<style>:root{color-scheme:dark}html,body{margin:0;min-height:100%;background:#050607;color:#eee5d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}#diag{position:relative;z-index:2147483647;margin:12px;padding:14px;border:1px solid #80663d;border-radius:14px;background:#080a0b;color:#eee5d9;box-shadow:0 12px 50px #000b}#title{font-weight:800;letter-spacing:.08em;font-size:13px;color:#deb36f}#state{font-size:13px;font-weight:800;margin:7px 0;color:#c4cbc9}#log{white-space:pre-wrap;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#aab2b0}.pass{color:#9adeb2!important}.fail{color:#ffaaa0!important}.warn{color:#f1cc84!important}#app{margin:12px;min-height:180px;background:#fff;color:#111;padding:12px;border-radius:12px;overflow:auto}</style>
</head>
<body>
<div id="diag"><div id="title">ARC FULL CORE · v06 AUTO-RENDER OFF · v071 OBSERVER GUARDED · AUTH OFF · CSS OFF</div><div id="state">Starting…</div><pre id="log">HTML: PASS</pre></div><div id="app"></div>
<script>
(function(){
const files=['app.js','v03.js','v031.js','v032.js','v033.js','v034.js','v04.js','v041.js','v042.js','v05.js','v051.js','v052.js','v053.js','v054.js','v06.js','v07.js','v071.js','v072.js','v075.js'];
const state=document.getElementById('state'),log=document.getElementById('log');let current='bootstrap',stopped=false;
function say(s,k){log.textContent+='\n'+s;if(k)log.className=k}function setState(s,k){state.textContent=s;state.className=k||''}function fail(m){if(stopped)return;stopped=true;setState('STOPPED at '+current,'fail');say('FAIL: '+m,'fail')}
window.addEventListener('error',e=>{if(!stopped)fail((e.filename||current)+': '+(e.message||'runtime error'))});window.addEventListener('unhandledrejection',e=>{if(!stopped)fail(current+': '+String((e.reason&&e.reason.message)||e.reason||'promise rejection'))});
function stamp(evt){try{let a=JSON.parse(localStorage.getItem('arcFullCoreControlLog')||'[]');a.push({t:new Date().toISOString(),evt,visibility:document.visibilityState,hasApp:!!document.querySelector('#app>*')});if(a.length>40)a=a.slice(-40);localStorage.setItem('arcFullCoreControlLog',JSON.stringify(a))}catch(e){}}
document.addEventListener('visibilitychange',()=>{stamp('visibility:'+document.visibilityState);if(document.visibilityState==='visible')setTimeout(()=>{if(!document.querySelector('#diag'))return;const ok=!!document.querySelector('#app>*');setState(ok?'RESUMED — DOM still present':'RESUMED — #app empty',ok?'pass':'fail');say('Resume check: '+(ok?'DOM still present':'#app empty'),ok?'pass':'fail');stamp('resume:'+ok)},250)});
function loadNormal(file){return new Promise((resolve,reject)=>{current=file;setState('Loading '+file+'…');let s=document.createElement('script'),done=false,t=setTimeout(()=>{if(done)return;done=true;reject(new Error(file+' timeout'))},8000);s.src='../'+file+'?dual-control=1';s.onload=()=>{if(done)return;done=true;clearTimeout(t);say(file+': loaded','pass');resolve()};s.onerror=()=>{if(done)return;done=true;clearTimeout(t);reject(new Error(file+' network error'))};document.body.appendChild(s)})}
async function loadV06(){current='v06.js';setState('Loading v06.js with only automatic render suppressed…');const baseRender=window.render||render;let calls=0;const blocker=function(){calls++;say('v06 automatic render intercepted','warn')};try{window.render=blocker;render=blocker;await loadNormal('v06.js')}finally{window.render=baseRender;render=baseRender}say('v06.js: loaded with automatic render suppressed ('+calls+' intercepted)','pass')}
async function loadV071(){current='v071.js';setState('Loading v071.js with self-trigger protection…');const NativeMO=window.MutationObserver;class GuardedMO{constructor(cb){this.t=null;this.o=null;this.active=true;this.n=new NativeMO((m)=>{if(!this.active)return;this.n.disconnect();try{cb(m,this)}finally{Promise.resolve().then(()=>{if(this.active&&this.t)this.n.observe(this.t,this.o)})}})}observe(t,o){this.t=t;this.o=o;this.n.observe(t,o)}disconnect(){this.active=false;this.n.disconnect()}takeRecords(){return this.n.takeRecords()}}window.MutationObserver=GuardedMO;try{await loadNormal('v071.js');say('v071.js: loaded with observer self-trigger protection','pass')}finally{window.MutationObserver=NativeMO}}
(async()=>{try{stamp('boot');for(let i=0;i<files.length;i++){const f=files[i];if(f==='v06.js')await loadV06();else if(f==='v071.js')await loadV071();else await loadNormal(f);await new Promise(r=>setTimeout(r,45))}current='ready';setState('READY — full ARC core through v075.js loaded with both controls. Background Safari now, then return.','pass');say('AUTH: OFF','pass');say('ARC CSS: OFF','pass');say('CONTROL: v06 auto-render suppressed','pass');say('CONTROL: v071 observer self-trigger guarded','pass');stamp('ready')}catch(e){fail(e&&e.message?e.message:String(e))}})();
})();
</script>
</body></html>

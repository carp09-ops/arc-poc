(function(){

function load(file){return new Promise((resolve,reject)=>{current=file;setState('Loading '+file+'…');let s=document.createElement('script'),done=false,t=setTimeout(()=>{if(done)return;done=true;reject(new Error(file+' timeout'))},8000);s.src='../'+file+'?v071-off=1';s.onload=()=>{if(done)return;done=true;clearTimeout(t);say(file+': loaded','pass');resolve()};s.onerror=()=>{if(done)return;done=true;clearTimeout(t);reject(new Error(file+' network error'))};document.body.appendChild(s)})}

async function loadV071ObserverOff(){current='v071.js';setState('Fetching v071.js and removing only its MutationObserver…');const r=await fetch('../v071.js?v071-off=1',{cache:'no-store'});if(!r.ok)throw new Error('v071 fetch HTTP '+r.status);let code=await r.text();const needle="  const mo=new MutationObserver(()=>{renderPassive();decorateProvenance();if(document.querySelector('.arc-connect-modal'))decorateModal()});\n  mo.observe(document.body,{childList:true,subtree:true});";if(!code.includes(needle))throw new Error('v071 observer block not found');code=code.replace(needle,"  // DIAGNOSTIC ONLY: MutationObserver disabled to isolate Safari runaway loop.");setState('Executing v071.js with observer disabled…');new Function(code+'\n//# sourceURL=v071-observer-off.js')();say('v071.js: loaded with MutationObserver fully disabled','pass')}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARC Staged Core Loader</title>
<style>
:root{color-scheme:dark}html,body{margin:0;min-height:100%;background:#050607;color:#eee5d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}#diag-panel{position:relative;z-index:2147483647;margin:12px;background:#080a0b;color:#eee5d9;border:1px solid #80663d;border-radius:14px;padding:14px;box-shadow:0 12px 50px #000b}#diag-title{font-weight:800;letter-spacing:.08em;font-size:13px;color:#deb36f}#diag-state{font-size:13px;margin-top:7px;color:#c4cbc9;font-weight:700}#diag-log{font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;margin:10px 0 0;color:#aab2b0}.pass{color:#9adeb2!important}.fail{color:#ffaaa0!important}.warn{color:#f1cc84!important}#app-shell{margin:12px;border:1px solid #2a2d2e;border-radius:14px;overflow:hidden;background:#0b0d0e}#app-label{padding:9px 12px;border-bottom:1px solid #2a2d2e;font-size:11px;color:#8d9693}#app{min-height:180px;padding:12px;background:#fff;color:#111}button{appearance:none;border:1px solid #66553b;background:#171a1b;color:#eee5d9;border-radius:9px;padding:8px 10px;font-weight:700}
</style>
</head>
<body>
<div id="diag-panel">
  <div id="diag-title">ARC STAGED CORE · AUTH DISABLED · CSS ISOLATED</div>
  <div id="diag-state">Diagnostic JavaScript started.</div>
  <pre id="diag-log">HTML: PASS\nInline JS: starting…</pre>
</div>
<div id="app-shell"><div id="app-label">ARC render target — production CSS intentionally NOT loaded yet</div><div id="app"></div></div>
<script>
(function(){
  var state=document.getElementById('diag-state');
  var log=document.getElementById('diag-log');
  var current='bootstrap';
  var stopped=false;
  function say(s,kind){log.textContent+='\n'+s;if(kind)log.className=kind;}
  function setState(s,kind){state.textContent=s;state.className=kind||'';}
  function fail(msg){if(stopped)return;stopped=true;setState('STOPPED at '+current,'fail');say('FAIL: '+msg,'fail');}
  window.addEventListener('error',function(e){if(stopped)return;var src=(e.filename||'').split('/').pop().split('?')[0];fail((src||current)+': '+(e.message||'runtime error'));});
  window.addEventListener('unhandledrejection',function(e){if(stopped)return;var reason=e.reason&&e.reason.message?e.reason.message:e.reason;fail(current+': '+String(reason||'promise rejection'));});
  say('Inline JS: PASS','pass');

  try{
    var raw=localStorage.getItem('arcState');
    if(raw===null){say('arcState: none on this GitHub Pages origin');}
    else{
      JSON.parse(raw);
      say('arcState: valid JSON ('+raw.length+' chars)');
    }
  }catch(e){say('arcState: MALFORMED JSON — app.js would crash on startup','warn');}

  function load(file){
    return new Promise(function(resolve,reject){
      current=file;setState('Loading '+file+'…');
      var done=false;
      var timer=setTimeout(function(){if(done)return;done=true;reject(new Error(file+' timed out after 8s'));},8000);
      var s=document.createElement('script');
      s.src='../'+file+'?stage=gh-core-2';
      s.async=false;
      s.onload=function(){if(done)return;done=true;clearTimeout(timer);say(file+': loaded','pass');resolve();};
      s.onerror=function(){if(done)return;done=true;clearTimeout(timer);reject(new Error(file+' network load failed'));};
      document.body.appendChild(s);
    });
  }

  (async function(){
    try{
      await load('app.js');
      await new Promise(function(r){setTimeout(r,120);});
      if(!document.querySelector('#app>*'))throw new Error('app.js executed but #app stayed empty');
      say('FIRST ARC RENDER: PASS','pass');

      var files=['v03.js','v031.js','v032.js','v033.js','v034.js','v04.js','v041.js','v042.js','v05.js','v051.js','v052.js','v053.js','v054.js','v06.js','v07.js','v071.js','v072.js','v075.js'];
      for(var i=0;i<files.length;i++){
        await load(files[i]);
        await new Promise(function(r){setTimeout(r,35);});
        if(!document.querySelector('#app>*'))throw new Error(files[i]+' left #app empty');
      }
      current='complete';
      setState('PASS — ARC product core loaded without auth','pass');
      say('AUTH LAYER: intentionally NOT loaded','pass');
      say('PRODUCTION CSS: intentionally NOT loaded','pass');
      say('CORE RESULT: PASS through v075.js','pass');
    }catch(e){fail(e&&e.message?e.message:String(e));}
  })();
})();
</script>
</body>
</html>
